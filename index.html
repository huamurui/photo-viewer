<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- ================= SEO ================= -->
    <title>Photos of HMR</title>
    <meta name="description" content="看看我拍的照片">
    <meta name="keywords" content="摄影, 照片墙, 画廊, 瀑布流, 虚拟列表, Exif, Photography, Gallery, HMR">
    <meta name="author" content="HMR">
    <meta name="robots" content="index, follow">
    <!-- 声明规范链接，防止带参数的链接分散权重 -->
    <link rel="canonical" href="https://huamurui.github.io/photo-viewer/">

    <!-- ================= Open Graph (社交分享优化) ================= -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://huamurui.github.io/photo-viewer/">
    <meta property="og:title" content="Photos of HMR">
    <meta property="og:description" content="看看我拍的照片。">
    <meta property="og:image" content="https://huamurui.github.io/photo-viewer/photos/thumbs/P1070261-%E5%B7%B2%E5%A2%9E%E5%BC%BA-NR.jpg">
    <meta property="og:site_name" content="Photos of HMR">

    <!-- ================= Twitter Cards ================= -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://huamurui.github.io/photo-viewer/">
    <meta name="twitter:title" content="Photos of HMR">
    <meta name="twitter:description" content="看看我拍的照片。">
    <meta name="twitter:image" content="https://huamurui.github.io/photo-viewer/photos/thumbs/P1070261-%E5%B7%B2%E5%A2%9E%E5%BC%BA-NR.jpg">

    <!-- ================= JSON-LD 结构化数据 (向搜索引擎声明画廊身份) ================= -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ImageGallery",
      "name": "Photos of HMR",
      "description": "个人摄影作品集，记录风景、人物与生活。",
      "url": "https://huamurui.github.io/photo-viewer/",
      "author": {
        "@type": "Person",
        "name": "HMR"
      }
    }
    </script>

    <meta name="theme-color" content="#f8f7f4">
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./gallery.css">
    <link rel="stylesheet" href="./viewer.css">
</head>
<body>
    <div id="page-shell">
        <a class="skip-link" href="#collection">跳至照片</a>
        <main class="page-width">
            <header class="gallery-header">
                <h1 id="page-title"><a class="wordmark" href="./">Photos of HMR</a></h1>
                <details class="gallery-settings">
                    <summary>浏览设置</summary>
                    <div class="collection-toolbar">
                        <div id="year-filters" class="year-filters" role="group" aria-label="按年份筛选">
                            <button class="year-filter is-active" type="button" data-year="all" aria-pressed="true">全部<span>—</span></button>
                        </div>
                        <div class="view-controls">
                            <label class="sort-control">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M8 4v16m-4-4 4 4 4-4M14 5h6m-6 5h4m-4 5h2"/></svg>
                                <select id="sort-order" aria-label="照片排序"><option value="newest">最新在前</option><option value="oldest">最早在前</option></select>
                                <svg class="select-arrow" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
                            </label>
                            <span class="control-divider"></span>
                            <button type="button" id="details-toggle" class="details-toggle" aria-pressed="false" title="显示拍摄参数"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v6m0-10v1"/></svg><span>参数</span></button>
                            <div class="layout-controls" role="group" aria-label="照片布局">
                                <button type="button" class="icon-button is-active" data-layout="relaxed" aria-label="舒展布局" aria-pressed="true" title="舒展布局"><svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="2.5" y="2.5" width="5.5" height="15" rx="1"/><rect x="12" y="2.5" width="5.5" height="15" rx="1"/></svg></button>
                                <button type="button" class="icon-button" data-layout="compact" aria-label="紧凑布局" aria-pressed="false" title="紧凑布局"><svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="2" y="2.5" width="3.5" height="15" rx=".7"/><rect x="8.25" y="2.5" width="3.5" height="15" rx=".7"/><rect x="14.5" y="2.5" width="3.5" height="15" rx=".7"/></svg></button>
                            </div>
                        </div>
                    </div>
                </details>
            </header>
            <section id="collection" aria-label="摄影作品" tabindex="-1">
                <p id="collection-status" class="visually-hidden" role="status">正在加载照片…</p>
                <div id="gallery-message" class="gallery-message" hidden></div>
                <ul id="photo-list" aria-label="照片列表" aria-busy="true"></ul>
                <p class="collection-end" id="collection-end" hidden>已显示全部照片</p>
            </section>
            <noscript><p class="gallery-message">请启用 JavaScript 浏览照片墙。</p></noscript>
        </main>
        <button id="back-to-top" class="back-to-top" type="button" aria-label="回到顶部" hidden><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button>
    </div>
    <script type="module" src="./gallery.js"></script>
</body>
</html>
